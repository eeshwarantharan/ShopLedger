<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A diagram of the public browser application, Express server, routes, library modules, configuration, JSON data store, and the numbered flow that places an order.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 24px Arial,sans-serif;fill:#0f172a}.sub{font:13px Arial,sans-serif;fill:#475569}
      .group{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.groupHead{font:700 15px Arial,sans-serif;fill:#334155}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.2}.boxTitle{font:700 13px Arial,sans-serif;fill:#0f172a}.small{font:12px Arial,sans-serif;fill:#334155}.tiny{font:11px Arial,sans-serif;fill:#475569}
      .highlight{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.highlightTitle{font:700 13px Arial,sans-serif;fill:#9a3412}
      .line{fill:none;stroke:#64748b;stroke-width:1.4;marker-end:url(#arrow)}.flow{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#flowArrow)}
      .num{fill:#2563eb}.numText{font:700 12px Arial,sans-serif;fill:#fff}.note{font:700 12px Arial,sans-serif;fill:#1d4ed8}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text x="36" y="38" class="title">ShopLedger — architecture and order placement</text>
  <text x="36" y="59" class="sub">Node / Express POS, Khata ledger, inventory and GST invoice app · verified source names and functions</text>

  <!-- Browser -->
  <rect x="36" y="94" width="190" height="220" rx="10" class="group"/>
  <text x="52" y="121" class="groupHead">Browser UI</text>
  <rect x="52" y="139" width="158" height="64" rx="6" class="box"/>
  <text x="64" y="162" class="boxTitle">public/index.html</text>
  <text x="64" y="181" class="small">POS · orders · Khata · audit</text>
  <rect x="52" y="218" width="158" height="77" rx="6" class="box"/>
  <text x="64" y="241" class="boxTitle">public/js/app.js</text>
  <text x="64" y="260" class="small">#place → POST /api/orders</text>
  <text x="64" y="278" class="tiny">catalog, preview, cancellation</text>

  <!-- Server -->
  <rect x="270" y="94" width="205" height="220" rx="10" class="group"/>
  <text x="286" y="121" class="groupHead">Express application</text>
  <rect x="286" y="139" width="173" height="112" rx="6" class="box"/>
  <text x="299" y="163" class="boxTitle">server.js</text>
  <text x="299" y="183" class="small">bodyParser.json()</text>
  <text x="299" y="201" class="small">static(public/)</text>
  <text x="299" y="219" class="small">mounts /api routers</text>
  <text x="299" y="237" class="tiny">GET /orders/:id/invoice</text>
  <rect x="286" y="266" width="173" height="30" rx="5" class="box"/>
  <text x="299" y="286" class="small">config.js</text>

  <!-- Routes -->
  <rect x="519" y="94" width="285" height="220" rx="10" class="group"/>
  <text x="535" y="121" class="groupHead">routes/ — mounted at /api</text>
  <rect x="535" y="139" width="119" height="66" rx="6" class="box"/>
  <text x="545" y="161" class="boxTitle">products.js</text><text x="545" y="181" class="tiny">GET /products</text><text x="545" y="196" class="tiny">GET /coupons</text>
  <rect x="669" y="139" width="119" height="66" rx="6" class="box"/>
  <text x="679" y="161" class="boxTitle">orders.js</text><text x="679" y="181" class="tiny">POST /orders</text><text x="679" y="196" class="tiny">POST /orders/:id/cancel</text>
  <rect x="535" y="220" width="119" height="66" rx="6" class="box"/>
  <text x="545" y="242" class="boxTitle">customers.js</text><text x="545" y="262" class="tiny">GET /customers</text><text x="545" y="277" class="tiny">POST /:id/settle</text>
  <rect x="669" y="220" width="119" height="66" rx="6" class="box"/>
  <text x="679" y="242" class="boxTitle">reports.js</text><text x="679" y="262" class="tiny">dashboard · GST · preview</text><text x="679" y="277" class="tiny">admin/export</text>

  <!-- Config and Data -->
  <rect x="845" y="94" width="319" height="220" rx="10" class="group"/>
  <text x="861" y="121" class="groupHead">Configuration and persistence</text>
  <rect x="861" y="139" width="136" height="118" rx="6" class="box"/>
  <text x="873" y="162" class="boxTitle">config.js</text><text x="873" y="181" class="tiny">port · shop · tax slabs</text><text x="873" y="198" class="tiny">inventory defaults</text><text x="873" y="215" class="tiny">coupon catalogue</text><text x="873" y="232" class="tiny">adminKey</text>
  <rect x="1012" y="139" width="136" height="118" rx="6" class="box"/>
  <text x="1024" y="162" class="boxTitle">data/db.json</text><text x="1024" y="181" class="tiny">products · customers</text><text x="1024" y="198" class="tiny">orders · settlements</text><text x="1024" y="215" class="tiny">auditLog</text><text x="1024" y="232" class="tiny">next IDs</text>

  <!-- Lib -->
  <rect x="36" y="361" width="1128" height="286" rx="10" class="group"/>
  <text x="52" y="389" class="groupHead">lib/ — application services</text>
  <rect x="52" y="408" width="168" height="92" rx="6" class="box"/>
  <text x="64" y="431" class="boxTitle">store.js</text><text x="64" y="451" class="tiny">read() · write()</text><text x="64" y="467" class="tiny">appendAudit()</text><text x="64" y="484" class="tiny">JSON file persistence</text>
  <rect x="236" y="408" width="182" height="92" rx="6" class="highlight"/>
  <text x="248" y="431" class="highlightTitle">inventory.js ★</text><text x="248" y="451" class="tiny">find() · getSellableStock()</text><text x="248" y="467" class="tiny">check() · reserve() · release()</text><text x="248" y="484" class="tiny">summarize()</text>
  <rect x="434" y="408" width="170" height="92" rx="6" class="box"/>
  <text x="446" y="431" class="boxTitle">pricing.js</text><text x="446" y="451" class="tiny">subtotal() · discount()</text><text x="446" y="467" class="tiny">computeTotals()</text>
  <rect x="620" y="408" width="170" height="92" rx="6" class="box"/>
  <text x="632" y="431" class="boxTitle">coupons.js</text><text x="632" y="451" class="tiny">normalizeCode() · validate()</text><text x="632" y="467" class="tiny">calculateDiscount() · listActive()</text>
  <rect x="806" y="408" width="182" height="92" rx="6" class="highlight"/>
  <text x="818" y="431" class="highlightTitle">orders.js ★ cancel</text><text x="818" y="451" class="tiny">add() · get() · list()</text><text x="818" y="467" class="tiny">cancel(id, reason)</text><text x="818" y="484" class="tiny">calls inventory.release()</text>
  <rect x="1004" y="408" width="144" height="92" rx="6" class="box"/>
  <text x="1016" y="431" class="boxTitle">ledger.js</text><text x="1016" y="451" class="tiny">findCustomer()</text><text x="1016" y="467" class="tiny">chargeOrderToKhata()</text><text x="1016" y="484" class="tiny">recordSettlement()</text>
  <rect x="52" y="522" width="168" height="92" rx="6" class="box"/>
  <text x="64" y="545" class="boxTitle">tax.js</text><text x="64" y="565" class="tiny">getRateForItem()</text><text x="64" y="581" class="tiny">getSlabPercent() · splitCgstSgst()</text>
  <rect x="236" y="522" width="182" height="92" rx="6" class="box"/>
  <text x="248" y="545" class="boxTitle">invoice.js</text><text x="248" y="565" class="tiny">computeInvoiceFigures()</text><text x="248" y="581" class="tiny">render()</text>
  <rect x="434" y="522" width="170" height="92" rx="6" class="box"/>
  <text x="446" y="545" class="boxTitle">reports.js</text><text x="446" y="565" class="tiny">getDashboardSummary()</text><text x="446" y="581" class="tiny">getGstReconciliation()</text>
  <rect x="620" y="522" width="170" height="92" rx="6" class="box"/>
  <text x="632" y="545" class="boxTitle">dates.js</text><text x="632" y="565" class="tiny">today()</text><text x="632" y="581" class="tiny">normalizeDateKey() · getFiscalYear()</text>

  <!-- Structural arrows -->
  <path d="M226 205 L270 205" class="line"/><path d="M475 196 L519 196" class="line"/>
  <path d="M1029 257 L1029 360" class="line"/><path d="M370 296 L370 360" class="line"/>
  <path d="M735 314 L735 360" class="line"/>
  <path d="M888 257 L790 408" class="line"/>

  <!-- numbered order path -->
  <path d="M210 256 C330 326, 543 326, 720 205" class="flow"/>
  <circle cx="400" cy="310" r="11" class="num"/><text x="396" y="315" class="numText">1</text><text x="417" y="315" class="note">POST /api/orders</text>
  <path d="M730 205 C680 300, 380 330, 327 408" class="flow"/>
  <circle cx="570" cy="322" r="11" class="num"/><text x="566" y="327" class="numText">2</text><text x="587" y="327" class="note">read product data</text>
  <path d="M418 454 L434 454" class="flow"/><circle cx="426" cy="436" r="11" class="num"/><text x="422" y="441" class="numText">3</text><text x="438" y="436" class="note">check stock</text>
  <path d="M604 454 L620 454" class="flow"/><circle cx="612" cy="436" r="11" class="num"/><text x="608" y="441" class="numText">4</text><text x="624" y="436" class="note">coupon</text>
  <path d="M519 500 L519 522" class="flow"/><circle cx="536" cy="515" r="11" class="num"/><text x="532" y="520" class="numText">5</text><text x="552" y="518" class="note">tax/totals</text>
  <path d="M604 476 C700 520, 850 520, 895 500" class="flow"/><circle cx="741" cy="530" r="11" class="num"/><text x="737" y="535" class="numText">6</text><text x="757" y="534" class="note">add order</text>
  <path d="M327 500 C420 670, 960 690, 1080 257" class="flow"/><circle cx="802" cy="684" r="11" class="num"/><text x="798" y="689" class="numText">7</text><text x="821" y="689" class="note">reserve stock, audit, write db.json</text>

  <!-- Footer legend -->
  <rect x="36" y="682" width="1128" height="82" rx="8" fill="#eef6ff" stroke="#bfdbfe"/>
  <text x="52" y="709" class="groupHead">Legend</text>
  <rect x="125" y="694" width="18" height="18" class="highlight"/><text x="151" y="708" class="small">Ticket focus: inventory.js; orders.js cancellation path</text>
  <line x1="490" y1="703" x2="530" y2="703" class="flow"/><text x="541" y="708" class="small">Blue numbered arrows: order placement sequence</text>
  <text x="52" y="738" class="tiny">Order flow: 1 request → 2 read → 3 inventory.check → 4 coupon validation → 5 pricing/tax → 6 orders.add → 7 inventory.reserve + audit + store.write.</text>
</svg>
